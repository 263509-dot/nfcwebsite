<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mystery Cuisine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#faf5ea;
    --ink:#2b2620;
    --gold:#b8862b;
    --line:rgba(43,38,32,0.14);
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0;
    min-height:100%;
    background:var(--cream);
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
  }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:7vh 6vw;
  }

  .stage{
    width:min(560px, 100%);
    text-align:center;
    position:relative;
  }

  .mascot{
    width:78px;
    margin:0 auto 0.6rem;
    animation:bob 2.4s ease-in-out infinite;
  }
  @keyframes bob{
    0%,100%{ transform:translateY(0) rotate(-3deg); }
    50%{ transform:translateY(-7px) rotate(3deg); }
  }

  .eyebrow{
    font-size:0.72rem;
    letter-spacing:0.28em;
    color:var(--gold);
    font-weight:600;
    margin:0 0 1.4rem;
  }

  .lead{
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-weight:500;
    font-size:clamp(1.1rem, 3.2vw, 1.5rem);
    color:#5a5142;
    margin:0 0 2.2rem;
  }

  .drum-wrap{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:0.9rem;
    min-height:4.6rem;
    margin-bottom:0.4rem;
  }
  .drum-badge{
    width:64px; height:64px;
    border-radius:50%;
    background:#fffdf8;
    border:1.5px solid rgba(184,134,43,0.35);
    display:flex; align-items:center; justify-content:center;
    color:var(--gold);
  }
  .drum-badge svg{ width:56%; height:56%; }
  .drum-badge.spin{ animation:spin 0.28s linear infinite; }
  @keyframes spin{ 100%{ transform:rotate(360deg); } }

  .audio-btn{
    position:fixed;
    top:1rem; right:1.1rem;
    background:none;
    border:1px solid rgba(43,38,32,0.25);
    color:var(--ink);
    font-size:0.75rem;
    padding:0.5rem 0.9rem;
    border-radius:999px;
    cursor:pointer;
  }
  .audio-btn:hover{ background:rgba(43,38,32,0.06); }

  .reveal{
    margin-top:1.6rem;
    opacity:0;
    transform:translateY(10px);
    transition:opacity 0.6s ease, transform 0.6s ease;
  }
  .reveal.show{ opacity:1; transform:translateY(0); }

  .origin-pill{
    display:inline-block;
    font-size:0.72rem;
    letter-spacing:0.12em;
    color:var(--gold);
    border:1px solid rgba(184,134,43,0.4);
    padding:0.3rem 0.85rem;
    border-radius:999px;
    margin-bottom:1rem;
    font-weight:600;
  }

  .dish-name{
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size:clamp(1.4rem, 4.6vw, 2rem);
    color:var(--ink);
    margin:0 0 0.2rem;
  }
  .en-name{
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-size:0.9rem;
    color:#8a8070;
    margin:0 0 1.1rem;
  }

  .photo-frame{
    width:100%;
    aspect-ratio:4/3;
    border-radius:14px;
    overflow:hidden;
    background:radial-gradient(circle at 50% 42%, #fff9ee 0%, #f0e4c8 70%, #e9dcbc 100%);
    box-shadow:0 22px 46px -18px rgba(43,38,32,0.35);
    margin-bottom:1.2rem;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    position:relative;
  }
  .photo-frame::after{
    content:"다른 음식 보기";
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:rgba(43,38,32,0.55);
    color:#fff;
    font-size:0.82rem;
    font-weight:600;
    letter-spacing:0.04em;
    opacity:0;
    transition:opacity 0.2s ease;
  }
  .photo-frame:hover::after{ opacity:1; }
  .dish-badge{
    width:56%;
    max-width:210px;
    aspect-ratio:1;
  }
  .dish-badge svg{ width:100%; height:100%; }

  .desc{
    font-size:0.96rem;
    line-height:1.85;
    color:#4a4438;
    max-width:32rem;
    margin:0 auto 1.2rem;
  }

  .action-row{
    display:flex;
    gap:0.6rem;
    justify-content:center;
    flex-wrap:wrap;
    margin-bottom:0.4rem;
  }
  .again-btn, .recipe-link{
    border:none;
    padding:0.8rem 1.5rem;
    border-radius:999px;
    font-size:0.86rem;
    font-weight:600;
    letter-spacing:0.02em;
    cursor:pointer;
    text-decoration:none;
    display:inline-block;
    transition:transform 0.15s ease, background 0.15s ease;
  }
  .again-btn{ background:var(--ink); color:var(--cream); }
  .again-btn:hover{ background:#3d362b; transform:translateY(-2px); }
  .recipe-link{ background:transparent; color:var(--gold); border:1.5px solid rgba(184,134,43,0.5); }
  .recipe-link:hover{ background:rgba(184,134,43,0.08); transform:translateY(-2px); }

  .footer-note{
    margin-top:2rem;
    font-size:0.68rem;
    color:#a39c8c;
    letter-spacing:0.08em;
  }
</style>
</head>
<body>

<button class="audio-btn" id="audioBtn">♪ 재즈 재생</button>

<div class="stage">
  <svg class="mascot" viewBox="0 0 100 110" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="50" cy="60" rx="30" ry="26" fill="#fff6e6" stroke="#2b2620" stroke-width="2.5"/>
    <path d="M22 44c0-14 12-26 28-26s28 12 28 26" fill="#ffffff" stroke="#2b2620" stroke-width="2.5"/>
    <path d="M20 44c14-6 46-6 60 0" fill="none" stroke="#2b2620" stroke-width="2.5"/>
    <circle cx="40" cy="58" r="3.4" fill="#2b2620"/>
    <circle cx="60" cy="58" r="3.4" fill="#2b2620"/>
    <path d="M40 70q10 8 20 0" fill="none" stroke="#2b2620" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="30" cy="66" rx="4" ry="3" fill="#f2a9a9" opacity="0.7"/>
    <ellipse cx="70" cy="66" rx="4" ry="3" fill="#f2a9a9" opacity="0.7"/>
  </svg>

  <p class="eyebrow">TODAY'S MYSTERY DISH</p>
  <p class="lead">the cuisine i will be introducing you is</p>

  <div class="drum-wrap">
    <div class="drum-badge spin" id="drumBadge"><svg viewBox="0 0 64 64"></svg></div>
  </div>

  <div class="reveal" id="reveal">
    <div class="origin-pill" id="originPill"></div>
    <div class="photo-frame" id="photoFrame">
      <div class="dish-badge" id="dishBadge"></div>
    </div>
    <p class="dish-name" id="dishName"></p>
    <p class="en-name" id="enName"></p>
    <p class="desc" id="descText"></p>
    <div class="action-row">
      <button class="again-btn" id="againBtn">다른 요리 뽑기</button>
      <a class="recipe-link" id="recipeLink" href="#" target="_blank" rel="noopener">조리법 보러가기 ↗</a>
    </div>
  </div>

  <p class="footer-note" id="footerNote"></p>
</div>

  const drumBadge = document.getElementById('drumBadge');
  const reveal = document.getElementById('reveal');
  const originPill = document.getElementById('originPill');
  const dishBadge = document.getElementById('dishBadge');
  const dishName = document.getElementById('dishName');
  const enName = document.getElementById('enName');
  const descText = document.getElementById('descText');
  const againBtn = document.getElementById('againBtn');
  const recipeLink = document.getElementById('recipeLink');
  const photoFrame = document.getElementById('photoFrame');
  const footerNote = document.getElementById('footerNote');

  footerNote.textContent = FOODS.length + "가지 신기한 외국 음식 중 하나가 무작위로 소개됩니다";

  let currentIndex = -1;

  function randomIndexExcluding(exclude){
    if(FOODS.length <= 1) return 0;
    let idx;
    do { idx = Math.floor(Math.random() * FOODS.length); } while(idx === exclude);
    return idx;
  }

  function iconSVG(key){
    return `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">${ICONS[key] || ICONS.toast}</svg>`;
  }

  function runDrumroll(){
    reveal.classList.remove('show');
    drumBadge.classList.add('spin');

    const finalIndex = randomIndexExcluding(currentIndex);
    const keys = Object.keys(ICONS);
    const totalSteps = 16;
    let step = 0;

    function tick(){
      const shownKey = (step < totalSteps - 1)
        ? keys[Math.floor(Math.random() * keys.length)]
        : FOODS[finalIndex].icon;
      drumBadge.innerHTML = iconSVG(shownKey);
      step++;
      if(step < totalSteps){
        const delay = 45 + Math.pow(step / totalSteps, 2) * 140;
        setTimeout(tick, delay);
      } else {
        settle(finalIndex);
      }
    }
    tick();
  }

  function settle(index){
    currentIndex = index;
    drumBadge.classList.remove('spin');

    const food = FOODS[index];
    originPill.textContent = food.origin;
    dishName.textContent = food.name;
    enName.textContent = food.en;
    descText.textContent = food.desc;
    dishBadge.innerHTML = iconSVG(food.icon);
    recipeLink.href = "https://www.google.com/search?q=" + encodeURIComponent(food.en + " recipe");

    requestAnimationFrame(() => reveal.classList.add('show'));
  }

  againBtn.addEventListener('click', runDrumroll);
  photoFrame.addEventListener('click', runDrumroll);

  window.addEventListener('load', () => {
    setTimeout(runDrumroll, 700);
  });

  /* ---- original jazzy ambience (not a copy of any existing recording) ---- */
  let audioCtx = null, playing = false, loopTimer = null;
  const audioBtn = document.getElementById('audioBtn');

  function scheduleSwing(){
    const notes = [261.6, 329.6, 392.0, 349.2, 293.7, 349.2, 392.0, 440.0];
    let t = audioCtx.currentTime;
    notes.forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.05, t + 0.05);
      gain.gain.linearRampToValueAtTime(0, t + 0.35);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 0.4);
      t += 0.42;
    });
    loopTimer = setTimeout(scheduleSwing, notes.length * 420);
  }

  audioBtn.addEventListener('click', () => {
    if(!playing){
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      scheduleSwing();
      playing = true;
      audioBtn.textContent = "■ 정지";
    } else {
      clearTimeout(loopTimer);
      if(audioCtx){ audioCtx.close(); audioCtx = null; }
      playing = false;
      audioBtn.textContent = "♪ 재즈 재생";
    }
  });
})();
</script>

</body>
